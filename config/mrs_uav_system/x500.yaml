# The HW API outputs (mrs_uav_hw_api/outputs) come from the spawn keywords (e.g. --enable-rangefinder -> distance_sensor).
# Setting mrs_uav_hw_api keys here overrides them for every spawned vehicle of this type.

uav_mass: 2.0

motor_params:
  n_motors: 4
  a: 0.209415
  b: -0.023573

mrs_uav_managers:

  constraint_manager:

    default_constraints:
      gps_garmin: "medium"
      gps_baro: "medium"
      rtk: "medium"
      aloam: "slow"
      hector_garmin: "slow"
      vio: "slow"
      optflow: "slow"
      other: "slow"
      ground_truth: "medium"
