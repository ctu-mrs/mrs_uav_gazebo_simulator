uav_mass: 2.0

motor_params:
  n_motors: 4
  a: 0.209415
  b: -0.023573

model_params:

  arm_length: 0.25 # [m]
  body_height: 0.1 # [m]

  propulsion:

    # force [N] = force_constant * rpm^2
    force_constant: 0.000042

    # torque [Nm] = torque_constant * force [N]
    torque_constant: 0.06

    prop_radius: 0.15 # [m]

    rpm:
      min: 0 # [revolutions/minute]
      max: 780 # [revolutions/minute]

mrs_uav_managers:

  constraint_manager:

    default_constraints:
      gps_garmin: "medium"
      gps_baro: "medium"
      rtk: "medium"
      aloam: "slow"
      hector_garmin: "slow"
      vio: "slow"
      optflow: "slow"
      other: "slow"
      ground_truth: "medium"
