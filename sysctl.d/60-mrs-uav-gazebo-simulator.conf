# Installed by ros-jazzy-mrs-uav-gazebo-simulator.
#
# gz-transport's UDP discovery sockets use the default receive buffer. Spawning drones floods them,
# dropped discovery messages leave subscriptions without data for good (e.g. PX4 missing a sensor),
# see https://github.com/gazebosim/gz-transport/issues/985
net.core.rmem_default=8388608
