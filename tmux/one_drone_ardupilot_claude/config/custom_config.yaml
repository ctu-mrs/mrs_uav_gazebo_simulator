# GET ALL PARAMETERS USABLE FOR CUSTOM CONFIG BY RUNNING:
## --------------------------------------------------------------
## |          rosrun mrs_uav_core get_public_params.py          #
## --------------------------------------------------------------

mrs_uav_managers:

  estimation_manager:

    # loaded state estimator plugins
    state_estimators: [
      "gps_baro"
      # NOTE: the "gps_garmin" estimator additionally requires a rangefinder
      # distance sensor input. The garmin rangefinder is not yet forwarded to
      # ArduPilot SITL, so it is disabled here.
    ]

    initial_state_estimator: "gps_baro" # will be used as the first state estimator
    agl_height_estimator: "" # only slightly filtered height for checking min height (not used in control feedback)

  control_manager:

    # ArduPilot SITL always publishes RC channels (ch5/ch8 = 1800), which would
    # perpetually trigger the MRS RC safety features (escalating failsafe on
    # ch8 >= threshold, rc joystick activation on ch7). There is no real RC in
    # this headless setup, so disable both. This was the root cause of the
    # "cannot toggle output ON, we landed in emergency" latch during takeoff.
    rc_joystick:

      enabled: false

    safety:

      escalating_failsafe:

        rc:
          enabled: false # can be triggered by RC button

  uav_manager:

    takeoff:

      # MpcController is unstable against the ArduPilot SITL sensory chain
      # (measured: vertical overshoot past the 2 m target to 5.4 m with a
      # throttle sawtooth, then lateral blow-up). The plain geometric
      # Se3Controller is far less model/lag sensitive and also what MRS uses
      # after every takeoff, so use it for the whole maneuver.
      during_takeoff:
        controller: "Se3Controller"
        tracker: "LandoffTracker"

      after_takeoff:
        controller: "Se3Controller"
        tracker: "MpcTracker"

    midair_activation:

      during_activation:
        controller: "MidairActivationController"
        tracker: "MidairActivationTracker"

      after_activation:
        controller: "MpcController"
        tracker: "MpcTracker"

