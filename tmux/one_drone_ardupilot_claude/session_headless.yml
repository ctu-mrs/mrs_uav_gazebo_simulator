# Headless test variant of the ArduPilot one-drone session.
# Differences vs session.yml:
#   - gazebo runs headless (gz_headless:=true)
#   - no rviz / no layout windows
#   - autostart and takeoff panes are inert (sleep) so the arming/takeoff is
#     driven manually via atomic_takeoff.sh, avoiding the autostart/takeoff race
#     that latches the "we landed in emergency" failsafe.
root: ./
name: simulation
socket_name: mrs
attach: false
tmux_options: -f /etc/ctu-mrs/tmux.conf
pre_window:
  - export UAV_NAME=uav1
  - export RUN_TYPE=simulation
  - export UAV_TYPE=x500
  - export PLATFORM_CONFIG=`ros2 pkg prefix mrs_uav_gazebo_simulator`/share/mrs_uav_gazebo_simulator/config/mrs_uav_system/$UAV_TYPE.yaml
  - export RMW_IMPLEMENTATION=rmw_zenoh_cpp
  - export USE_SIM_TIME="true"
startup_window: status
windows:
  - zenoh_router:
      layout: tiled
      panes:
        - ros2 run rmw_zenoh_cpp rmw_zenohd
  - gazebo:
      layout: tiled
      panes:
        - ros2 launch mrs_uav_gazebo_simulator simulation.launch.py gz_headless:=true gz_verbose:=true
        - |
          waitForGazebo; sleep 5; ros2 service call /mrs_drone_spawner/spawn mrs_msgs/srv/String "{value: '1 --$UAV_TYPE --use-ardupilot --pos 0 0 0.3 0'}"
  - ardupilot_api:
      layout: tiled
      panes:
        - ros2 launch mrs_uav_ardupilot_api api.launch.py
  - core:
      layout: tiled
      panes:
        - ros2 launch mrs_uav_core core.launch.py
          platform_config:=$PLATFORM_CONFIG
          world_config:=./config/world_config.yaml
          custom_config:=./config/custom_config.yaml
          network_config:=./config/network_config.yaml
  - status:
      layout: tiled
      panes:
        - ros2 run mrs_uav_status status.sh
  - autostart:
      layout: tiled
      panes:
        - sleep infinity
  - takeoff:
      layout: tiled
      panes:
        - sleep infinity
